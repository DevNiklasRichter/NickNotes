# Weekly, grouped dependency updates. Each update is an ordinary PR and must pass the Windows CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    # Major versions (TypeScript, ESLint, Electron, Node types …) are upgraded deliberately, not by bot.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  # The workflow pins actions to commit hashes; Dependabot keeps those hashes current.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ['*']
