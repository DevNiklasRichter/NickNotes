<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NickNotes</title>
    <style>
      html,body{margin:0;background:#f3f4f6;color:#1f2328;font:15px 'Segoe UI',sans-serif}html[data-theme=dark],html[data-theme=dark] body{background:#1f252f;color:#edf0f5}
      @media(prefers-color-scheme:dark){html:not([data-theme=light]),html:not([data-theme=light]) body{background:#1f252f;color:#edf0f5}}
      #startup{box-sizing:border-box;min-height:100vh;padding:54px max(24px,calc((100vw - 880px)/2));display:flex;flex-direction:column;gap:14px}#startup[hidden],#root[hidden]{display:none}
      #startup h1{margin:0;font-size:23px}#startup p{margin:0;line-height:1.5}#startup label{font-weight:600;margin-top:12px}
      #startup textarea{box-sizing:border-box;width:100%;min-height:240px;flex:1;resize:vertical;border:1px solid #b5bdca;border-radius:8px;padding:15px;background:transparent;color:inherit;font:16px/1.6 'Segoe UI',sans-serif}#startup textarea:focus{outline:2px solid #6ea7f3;outline-offset:1px}
      #startup small{opacity:.75;line-height:1.5}#startup button{align-self:flex-start;padding:8px 14px;cursor:pointer}#startup pre{white-space:pre-wrap;overflow:auto;max-height:160px}#startup-error{border-left:3px solid #d55555;padding-left:12px}
    </style>
    <script src="/startup.js" defer></script>
  </head>
  <body>
    <main id="startup" aria-label="NickNotes Schnellstart">
      <h1>NickNotes</h1>
      <p id="startup-status" role="status">Die Oberfläche wird geladen. Du kannst gleich schreiben.</p>
      <label for="startup-draft">Schnellerfassungsentwurf</label>
      <textarea id="startup-draft" placeholder="Gedanken sofort festhalten …" spellcheck="true" readonly></textarea>
      <small id="startup-draft-status">Lokaler Entwurf. Er wird nach dem Start in Quick Capture übernommen und erst beim Absenden in der gewählten NoteBase gespeichert.</small>
      <section id="startup-error" role="alert" hidden><p>Die Oberfläche konnte nicht vollständig gestartet werden.</p><pre id="startup-error-detail"></pre><button id="startup-retry">Erneut laden</button></section>
    </main>
    <div id="root" hidden></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
