appId: local.nicknotes.desktop
productName: NickNotes
directories:
  app: dist/app
  output: dist/installers
files:
  - desktop/**
  - frontend/**
  - package.json
  - THIRD_PARTY_NOTICES.txt
  - LICENSE
  - runtime-dependencies.json
asar: true
npmRebuild: false
allowMissingDependencies: false
beforePack: scripts/before-pack.mjs
extraResources:
  - from: dist/backend/nicknotes-backend
    to: backend
compression: normal
electronLanguages: [de, en-US]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: false
  artifactName: NickNotes-Setup-${version}-${arch}.${ext}
publish:
  provider: github
  owner: DevNiklasRichter
  repo: NickNotes
  private: false
  releaseType: draft
